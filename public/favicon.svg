<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <!-- Neo-brutalist offset shadow -->
  <rect x="6" y="6" width="52" height="52" rx="14" fill="#000000" />
  <!-- Main badge background (Electric Yellow) -->
  <rect x="4" y="4" width="52" height="52" rx="14" fill="#FFE600" stroke="#000000" stroke-width="3.5" />
  
  <!-- Topology Links (interconnecting lines) -->
  <line x1="20" y1="22" x2="44" y2="22" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  <line x1="20" y1="22" x2="32" y2="44" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  <line x1="44" y1="22" x2="32" y2="44" stroke="#000000" stroke-width="3" stroke-linecap="round" />
  
  <!-- Topology Orbit / Sphere ring -->
  <ellipse cx="32" cy="30" rx="19" ry="8" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="4 3" />

  <!-- Node 1: Top-Left (Cyan Router/Switch Node) -->
  <circle cx="20" cy="22" r="7.5" fill="#00F0FF" stroke="#000000" stroke-width="3" />
  <circle cx="20" cy="22" r="2.5" fill="#000000" />

  <!-- Node 2: Top-Right (Electric Green Server/Gateway Node) -->
  <circle cx="44" cy="22" r="7.5" fill="#00FF66" stroke="#000000" stroke-width="3" />
  <circle cx="44" cy="22" r="2.5" fill="#000000" />

  <!-- Node 3: Bottom-Center (Vibrant Magenta Client Host Node) -->
  <circle cx="32" cy="44" r="8" fill="#FF3366" stroke="#000000" stroke-width="3" />
  <circle cx="32" cy="44" r="2.8" fill="#FFFFFF" stroke="#000000" stroke-width="1.5" />
</svg>
